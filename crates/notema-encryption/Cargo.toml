[package]
name = "notema-encryption"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
age.workspace = true
ed25519-dalek.workspace = true
getrandom.workspace = true
hex.workspace = true
notema-timing.workspace = true
serde.workspace = true
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true
zeroize.workspace = true

# `geteuid`, for checking that the identity file is still ours before running a
# key command out of it. `std::os::unix` gives a file's owner but no way to ask
# which one we are.
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

# The OS keychain backends, one per platform. Targets outside these cfgs
# (Android/Termux) pull in none of it and fall back to `keys_command`; the musl,
# i686, armv7 and riscv64 artifacts are all `target_os = "linux"`, so they do
# build the Secret Service backend and fall back at runtime when no D-Bus
# session answers. That backend is the async one because it speaks D-Bus through
# zbus — pure Rust, unlike the sync one, which needs the libdbus C library and
# would not cross-compile to those targets.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["v1", "apple-native-keyring-store"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { workspace = true, features = ["v1", "windows-native-keyring-store"] }

# This store rides zbus 5, matching the Linux side of notema-context, so both
# trees share one zbus.
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
keyring = { workspace = true, features = ["v1", "zbus-secret-service-keyring-store"] }
